<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="#f8fafc"/>
<style>.t{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:700}.s{font-size:18px}.b{font-size:20px;font-weight:700}.m{font-size:15px}.card{fill:#fff;stroke:#dbeafe;stroke-width:2}.num{fill:#2563eb}.muted{fill:#64748b}</style>
<text x="50" y="58" class="t h">QQ 邮箱 → Gmail → ChatGPT：重要邮件智能提醒</text>
<text x="50" y="90" class="t s muted">脱敏演示 · 示例地址均为占位信息</text>
<g transform="translate(50 125)"><rect class="card" rx="18" width="250" height="350"/><circle class="num" cx="34" cy="36" r="20"/><text x="28" y="43" fill="white" font-size="20" font-family="Arial">1</text><text x="65" y="43" class="t b">新建专用文件夹</text><text x="25" y="90" class="t s">文件夹名称</text><rect x="25" y="108" width="200" height="45" rx="8" fill="#f1f5f9"/><text x="43" y="137" class="t s">📁 求职</text><text x="25" y="195" class="t m muted">用于集中归档重要邮件</text><text x="25" y="225" class="t m muted">方便人工复查规则效果</text></g>
<text x="315" y="300" class="t h" fill="#2563eb">→</text>
<g transform="translate(350 125)"><rect class="card" rx="18" width="250" height="350"/><circle class="num" cx="34" cy="36" r="20"/><text x="28" y="43" fill="white" font-size="20" font-family="Arial">2</text><text x="65" y="43" class="t b">设置收信规则</text><text x="25" y="88" class="t m">主题：面试 / 笔试 / 测评</text><text x="25" y="120" class="t m">正文：校招 / 录用 / 签约</text><text x="25" y="152" class="t m">附件：offer / 通知</text><rect x="25" y="190" width="200" height="46" rx="8" fill="#eff6ff"/><text x="40" y="219" class="t m">移动到：求职</text><rect x="25" y="250" width="200" height="58" rx="8" fill="#eff6ff"/><text x="40" y="275" class="t m">自动转发到</text><text x="40" y="297" class="t m">yourname@gmail.com</text></g>
<text x="615" y="300" class="t h" fill="#2563eb">→</text>
<g transform="translate(650 125)"><rect class="card" rx="18" width="220" height="350"/><circle class="num" cx="34" cy="36" r="20"/><text x="28" y="43" fill="white" font-size="20" font-family="Arial">3</text><text x="65" y="43" class="t b">确认转发</text><text x="25" y="92" class="t m">Gmail 收到验证邮件</text><rect x="25" y="125" width="170" height="115" rx="10" fill="#f1f5f9"/><text x="40" y="157" class="t m">发件人</text><text x="40" y="180" class="t m muted">example@qq.com</text><rect x="40" y="200" width="115" height="30" rx="6" fill="#2563eb"/><text x="58" y="221" fill="white" font-size="14" font-family="Arial,'Microsoft YaHei'">接受转发</text><text x="25" y="285" class="t m muted">手机验证 / 邮箱确认</text><text x="25" y="310" class="t m muted">必须由本人完成</text></g>
<text x="885" y="300" class="t h" fill="#2563eb">→</text>
<g transform="translate(920 125)"><rect class="card" rx="18" width="230" height="350"/><circle class="num" cx="34" cy="36" r="20"/><text x="28" y="43" fill="white" font-size="20" font-family="Arial">4</text><text x="65" y="43" class="t b">AI 判断并提醒</text><rect x="22" y="78" width="186" height="175" rx="10" fill="#f0fdf4"/><text x="37" y="108" class="t b" font-size="17">新的重要提醒</text><text x="37" y="140" class="t m">事项：在线测评</text><text x="37" y="168" class="t m">截止：明天 21:00</text><text x="37" y="196" class="t m">状态：尚未完成</text><text x="37" y="224" class="t m">建议：今天完成</text><text x="22" y="290" class="t m muted">过滤广告与重复邮件</text><text x="22" y="315" class="t m muted">提取 Deadline 和下一步</text></g>
<rect x="50" y="515" width="1100" height="90" rx="16" fill="#eff6ff"/>
<text x="75" y="553" class="t b">核心原则</text><text x="75" y="583" class="t s">邮箱规则负责别漏掉，AI 负责别烦你。关键词做粗筛，语义判断决定是否真正提醒。</text>
</svg>