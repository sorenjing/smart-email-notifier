<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#f8fafc"/>
<style>.t{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:700}.s{font-size:18px}.b{font-size:19px;font-weight:700}.m{font-size:15px}.card{fill:#fff;stroke:#dbeafe;stroke-width:2}.num{fill:#2563eb}.muted{fill:#64748b}</style>
<text x="50" y="55" class="t h">QQ 邮箱 → Gmail → ChatGPT：秋招重要邮件自动提醒</text>
<rect x="50" y="72" width="245" height="34" rx="17" fill="#fef3c7"/><text x="70" y="95" class="t m">演示数据 · 非真实招聘通知</text>
<g transform="translate(50 135)"><rect class="card" rx="18" width="250" height="360"/><circle class="num" cx="34" cy="36" r="20"/><text x="28" y="43" fill="white" font-size="20" font-family="Arial">1</text><text x="65" y="43" class="t b">QQ 邮箱分类</text><text x="25" y="88" class="t m">新建文件夹：求职</text><text x="25" y="126" class="t m">收信规则粗筛：</text><text x="25" y="156" class="t m">面试 / 笔试 / 测评</text><text x="25" y="184" class="t m">校招 / Offer / 签约</text><rect x="25" y="215" width="200" height="48" rx="8" fill="#eff6ff"/><text x="40" y="245" class="t m">移动到：求职</text><rect x="25" y="278" width="200" height="50" rx="8" fill="#eff6ff"/><text x="40" y="309" class="t m">转发到：演示 Gmail</text></g>
<text x="315" y="320" class="t h">→</text>
<g transform="translate(350 135)"><rect class="card" rx="18" width="230" height="360"/><circle class="num" cx="34" cy="36" r="20"/><text x="28" y="43" fill="white" font-size="20" font-family="Arial">2</text><text x="65" y="43" class="t b">本人确认</text><text x="25" y="92" class="t m">QQ 邮箱</text><text x="25" y="120" class="t m muted">手机验证（如触发）</text><text x="25" y="175" class="t m">Gmail</text><text x="25" y="203" class="t m muted">接受自动转发</text><rect x="25" y="242" width="180" height="52" rx="9" fill="#f1f5f9"/><text x="43" y="274" class="t m">登录 / 验证 / 授权</text><text x="25" y="326" class="t m muted">敏感步骤始终由本人完成</text></g>
<text x="595" y="320" class="t h">→</text>
<g transform="translate(630 135)"><rect class="card" rx="18" width="230" height="360"/><circle class="num" cx="34" cy="36" r="20"/><text x="28" y="43" fill="white" font-size="20" font-family="Arial">3</text><text x="65" y="43" class="t b">ChatGPT 自动判断</text><text x="25" y="90" class="t m">定时检查新邮件</text><text x="25" y="122" class="t m">识别是否需要行动</text><text x="25" y="154" class="t m">过滤广告 / 重复通知</text><rect x="25" y="195" width="180" height="108" rx="10" fill="#eff6ff"/><text x="40" y="225" class="t m">提取：</text><text x="40" y="252" class="t m">时间 · Deadline</text><text x="40" y="279" class="t m">下一步动作</text><text x="25" y="330" class="t m muted">关键词召回，AI 做最终判断</text></g>
<text x="875" y="320" class="t h">→</text>
<g transform="translate(910 135)"><rect class="card" rx="18" width="240" height="360"/><circle class="num" cx="34" cy="36" r="20"/><text x="28" y="43" fill="white" font-size="20" font-family="Arial">4</text><text x="65" y="43" class="t b">只提醒重要事项</text><rect x="22" y="82" width="196" height="190" rx="10" fill="#f0fdf4"/><text x="37" y="113" class="t b">腾讯｜面试邀请</text><text x="37" y="146" class="t m">岗位：前端开发</text><text x="37" y="177" class="t m">时间：08/20 14:00</text><text x="37" y="208" class="t m">确认截止：08/18</text><text x="37" y="239" class="t m">下一步：按邮件确认</text><text x="22" y="310" class="t m muted">无真实姓名 / 邮箱 / URL</text><text x="22" y="336" class="t m muted">所有内容均为虚构演示</text></g>
<rect x="50" y="530" width="1100" height="100" rx="16" fill="#eff6ff"/>
<text x="75" y="570" class="t b">核心原则</text><text x="75" y="602" class="t s">邮箱规则负责别漏掉，AI 负责别烦你。一次完成必要配置，之后让 ChatGPT 自动检查并只提醒真正需要行动的邮件。</text>
</svg>